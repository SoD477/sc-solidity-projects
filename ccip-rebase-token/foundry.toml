[profile.default]
src = "src"
out = "out"
libs = ["lib"]
rpc_endpoints = { eth = "https://eth-sepolia.g.alchemy.com/v2/nhieShprbKOL6UR1GnPLt", arb = "https://arb-sepolia.g.alchemy.com/v2/nhieShprbKOL6UR1GnPLt" }

remappings = [
    '@openzeppelin/contracts=lib/openzeppelin-contracts/contracts',
    "@ccip/contracts=lib/ccip/contracts",
    "@chainlink/local/=lib/chainlink-local/",
]

[lint]
exclude_lints = ["mixed-case-variable", "screaming-snake-case-immutable"]

[invariant]
runs = 128
depth = 128
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
